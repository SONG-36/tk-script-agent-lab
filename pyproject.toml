[project]
name = "tk-script-agent-lab"
version = "0.0.0"
description = "Learning baseline for a phased TikTok Script Agent Lab."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1,<2",
    "langgraph-cli[inmem]",
    "pydantic>=2,<3",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tk_script_agent_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
